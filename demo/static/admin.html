<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>后台 · 引导员遥控</title>
<style>
:root{--bg:#f4f6fa;--card:#ffffff;--line:rgba(15,27,46,.12);--fg:#16233a;--dim:#5f6e86;--accent:#1e4d99;--gold:#8a6a1f;--danger:#c8413a;
  --u:clamp(9px,1.05vh,20px);--fs-sm:clamp(12px,calc(var(--u)*1),17px);--fs-md:clamp(14px,calc(var(--u)*1.35),24px);--fs-lg:clamp(20px,calc(var(--u)*2.2),42px);
  --sp-1:calc(var(--u)*.5);--sp-2:var(--u);--sp-3:calc(var(--u)*1.5);--sp-4:calc(var(--u)*2);
  --r-sm:calc(var(--u)*.5);--r-md:calc(var(--u)*.75);--r-lg:calc(var(--u)*1.1);--sh-panel:0 calc(var(--u)*1.2) calc(var(--u)*3.4) rgba(5,12,24,.28)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:18px;max-width:640px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.sub b{color:var(--gold);font-weight:500}
h3{font-size:13px;color:var(--dim);font-weight:500;letter-spacing:0;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--fg);font-size:16px;font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button.on{border-color:var(--accent);color:var(--accent)}
button.danger{color:var(--danger);border-color:#5a2d33}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 8px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--accent)}
.stats span{font-size:11px;color:var(--dim)}
.sess{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;
  margin-bottom:8px;display:flex;align-items:center;gap:10px}
.sess b{font-size:17px}
.sess i{font-style:normal;color:var(--dim);font-size:13px}
.sess .r{margin-left:auto;display:flex;gap:8px}
.sess .r button{padding:10px 14px;font-size:13px}
.kap{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:14px}
.kap input{flex:1}
.kap b{color:var(--accent);min-width:44px;text-align:right}
.note{color:#5f6d86;font-size:12px;margin-top:8px;line-height:1.8}
.auth-card{max-width:460px;margin:clamp(48px,14vh,160px) auto 0;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 18px 60px rgba(5,12,24,.28)}
.auth-card h1{font-size:24px;margin-bottom:6px}.auth-card p{color:var(--dim);font-size:13px;line-height:1.7}
.auth-card form{display:grid;gap:10px;margin-top:20px}.auth-card label{font-size:12px;color:var(--dim)}
.auth-card input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:9px;background:#f4f6fa;color:var(--fg);padding:0 13px;font:inherit;font-size:16px;outline:none}
.auth-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,139,224,.16)}
.auth-card button{min-height:48px;background:var(--accent);border-color:var(--accent);color:#fff;margin-top:4px}
.auth-error{min-height:1.6em;color:var(--danger)!important;font-size:12px!important}.auth-note{margin-top:14px;color:#5f6d86!important;font-size:11px!important}
.logout{padding:8px 12px;border-radius:8px;font-size:12px;color:var(--dim);border-color:var(--line)}.logout:hover{color:var(--fg);border-color:var(--accent)}
[hidden]{display:none!important}

/* 电脑端优先：左侧看板，右侧焦点与会话控制；720px 以下自然退回单列。 */
body{max-width:none;min-height:100vh;padding:clamp(20px,3vw,48px);background:
  radial-gradient(90% 70% at 100% 0%,rgba(79,139,224,.1),transparent 58%),var(--bg)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;max-width:1440px;margin:0 auto 28px}
.page-head h1{font-size:clamp(24px,2.2vw,38px);letter-spacing:-.02em}.page-head .sub{margin:5px 0 0;font-size:13px}.live-label{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}.live-label span{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(79,139,224,.18)}
.layout{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,.95fr);gap:clamp(18px,2.4vw,36px);align-items:start}
.left-col,.right-col{display:grid;gap:14px;align-content:start}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.section-head h2,.section-head h3{margin:0;color:var(--fg);font-size:16px;font-weight:700}.section-head span{font-size:11px;color:var(--dim)}
.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}.stats div{min-height:86px;display:flex;flex-direction:column;justify-content:center;border-radius:12px;padding:12px 8px}.stats b{font-size:clamp(22px,2.2vw,34px)}.stats span{font-size:11px}
.status-card,.control-card,.sessions-card,.danger-zone{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:14px;padding:16px}.status-card h3,.control-card h3,.danger-zone h3{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:600}.status-card .note+.note{margin-top:5px}
.control-card .grid{gap:10px}.control-card button{min-height:50px}.control-card h3 small{font-size:11px;font-weight:400;color:var(--dim)}
.kap{padding:12px;background:rgba(15,27,46,.04);border-radius:10px}.kap button{padding:10px 16px;font-size:14px;min-height:40px}.kap input{accent-color:var(--accent)}
.sessions-card{min-height:180px}.sessions-card .section-head{margin-bottom:10px}.sessions-card #sessions{max-height:calc(100vh - 430px);overflow:auto;padding-right:2px}
.sess{border-radius:10px;padding:12px;margin-bottom:8px;background:rgba(15,27,46,.03)}.sess:last-child{margin-bottom:0}.sess .r button{min-height:42px;padding:9px 13px}.sess .r{gap:6px}
.danger-zone{border-color:rgba(200,65,58,.24);background:rgba(200,65,58,.08)}.danger-zone .danger{width:100%;min-height:48px;background:rgba(200,65,58,.10)}
.danger-list-head{margin:16px 0 6px;font-size:11px;color:var(--dim)}.danger-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(200,65,58,.12);font-size:13px;color:#8a4a47}.danger-row .danger{width:auto;min-height:38px;padding:8px 13px;font-size:12px}
@media (max-width:720px){
  body{padding:18px;overflow-x:hidden}.page-head{flex-direction:column;gap:12px;margin-bottom:20px}.page-head .live-label{align-self:flex-start}.live-label{font-size:11px;padding:7px 9px}.layout{display:block}.left-col,.right-col{gap:12px}.right-col{margin-top:18px}.stats{gap:7px}.stats div{min-height:74px;padding:9px 5px}.stats b{font-size:22px}.sessions-card #sessions{max-height:none}.sess>div:first-child{min-width:0;overflow-wrap:anywhere}.status-card,.control-card,.sessions-card,.danger-zone{padding:14px}
}
@media (max-width:420px){
  .kap{display:grid;grid-template-columns:minmax(0,1fr) auto}.kap input{width:100%;min-width:0}.kap button{grid-column:1/-1;width:100%}
  .sess{align-items:flex-start}.sess .r{flex:none}.danger-row span{min-width:0;overflow-wrap:anywhere}
}
@media (max-width:350px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 白卡投影：面板浮在纸灰底上 */
.auth-card,.status-card,.control-card,.sessions-card,.danger-zone,.stats div,.sess{box-shadow:0 1px 2px rgba(24,38,66,.04),0 10px 26px -22px rgba(24,38,66,.28)}
</style>
</head>
<body>
<section class="auth-card" id="loginPanel" aria-labelledby="loginTitle">
  <h1 id="loginTitle">进入现场控制台</h1>
  <p>请输入现场管理员密钥以继续。</p>
  <form id="loginForm">
    <label for="adminPassword">管理员密钥</label>
    <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="loginButton">登录</button>
    <p class="auth-error" id="loginError" role="alert" aria-live="polite"></p>
  </form>
  <p class="auth-note">如需访问，请联系现场负责人。</p>
</section>

<div id="console" hidden>
<header class="page-head">
  <div><h1>引导员遥控</h1>
  <div class="sub"><b>燕山大学 · 网安周</b> · 现场控制台</div></div>
  <div class="live-label"><span></span>现场控制 <button class="logout" id="logoutButton" type="button">退出</button></div>
</header>

<div class="layout">
  <section class="left-col" aria-label="聚合看板">
    <div class="section-head"><h2>现场聚合</h2><span>汇总指标</span></div>
    <div class="stats" id="stats"></div>
    <section class="status-card"><h3>内容库与参数</h3><div class="note" id="lib"></div><div class="note" id="agg"></div></section>
    <section class="status-card"><h3>现场提示</h3><p class="note">大屏默认自动跟随最近活跃会话；需要讲解某位观众时，可在右侧锁定。删除与重置操作会再次确认。</p></section>
  </section>

  <section class="right-col" aria-label="焦点控制与会话列表">
    <section class="control-card"><h3>大屏页面</h3>
      <div class="grid">
        <button id="pAuto" type="button">自动跟随</button>
        <button id="pStandby" type="button">待机 / 隐私承诺</button>
      </div>
    </section>

    <section class="control-card"><h3>侧写灵敏度 κ <small>（越小分数越高）</small></h3>
      <div class="kap">
        <input type="range" id="k" min="0.5" max="4" step="0.1" value="2">
        <b id="kv">2.0</b>
        <button type="button" id="applyK">应用</button>
      </div>
      <div class="note">开始前确认参数，现场可按需要微调。</div>
    </section>

    <section class="sessions-card"><div class="section-head"><h3>在场会话</h3><span>锁定后大屏固定到该会话</span></div><div id="sessions"></div></section>

    <section class="danger-zone"><h3>危险操作</h3>
      <button class="danger" type="button" id="resetButton">一键重置 · 清空全部会话</button>
      <div class="danger-list-head">删除单个会话</div>
      <div id="deleteSessions"></div>
      <div class="note">重置或删除会立即清除对应会话的行为与侧写，且不可恢复。操作前会再次确认。</div>
    </section>
  </section>
</div>
</div>

<script>
let FOCUS = {sid:null, locked:false, page:"auto"};
let AUTHENTICATED = false, AUTH_VERSION = 0, loadPromise = null, loadAgain = false;
let controlQueue = Promise.resolve();
const esc = value => String(value == null ? "" : value).replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]));
const loginPanel = document.getElementById("loginPanel");
const consolePanel = document.getElementById("console");
const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const passwordInput = document.getElementById("adminPassword");
const loginError = document.getElementById("loginError");

async function fetchTimed(url, opts, timeoutMs = 9000){
  const options = Object.assign({}, opts || {});
  const canAbort = typeof AbortController === "function" && !options.signal;
  const controller = canAbort ? new AbortController() : null;
  let timer = 0;
  if(controller){ options.signal = controller.signal; timer = setTimeout(()=>controller.abort(), timeoutMs); }
  try { return await fetch(url, options); }
  catch(e){
    if(e && e.name === "AbortError") { const err = new Error("network"); err.code = "network"; throw err; }
    throw e;
  }
  finally { if(timer) clearTimeout(timer); }
}

function clearDashboard(){
  ["stats","lib","agg","sessions","deleteSessions"].forEach(id=>{
    const el=document.getElementById(id); if(el) el.textContent="";
  });
}

function setAuthenticated(on){
  AUTH_VERSION++;
  AUTHENTICATED = !!on;
  loginPanel.hidden = AUTHENTICATED;
  consolePanel.hidden = !AUTHENTICATED;
  if(!AUTHENTICATED){
    clearDashboard();
    requestAnimationFrame(()=>{ try{ passwordInput.focus({preventScroll:true}); }catch(_){} });
  }
}

loginForm.addEventListener("submit", async e=>{
  e.preventDefault();
  loginButton.disabled = true;
  loginError.textContent = "";
  try{
    const r = await fetchTimed("/api/admin/login", {
      method:"POST", credentials:"same-origin",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password:passwordInput.value})
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok || !d || d.ok !== true){
      const err = new Error(d.error||("http_"+r.status));
      err.code = d.error || ("http_"+r.status); err.status = r.status; throw err;
    }
    passwordInput.value = "";
    setAuthenticated(true);
    await load();
  }catch(e){
    loginError.textContent = e.status === 429 ? "尝试过于频繁，请稍后再试"
      : (e.code === "network" || e.message === "network" || e instanceof TypeError)
      ? "暂时无法连接后台，请稍后重试" : "密钥不正确，请重新输入";
    setAuthenticated(false);
  }finally{
    loginButton.disabled = false;
  }
});

document.getElementById("logoutButton").onclick = async ()=>{
  try{ await fetchTimed("/api/admin/logout",{method:"POST",credentials:"same-origin"},5000); }catch(_e){}
  setAuthenticated(false);
  loginError.textContent = "已退出后台";
};

async function loadOnce(){
  const requestVersion = AUTH_VERSION;
  let d;
  try{
    const r = await fetchTimed("/api/admin/stats",{credentials:"same-origin",cache:"no-store"});
    d = await r.json().catch(()=>({}));
    if(requestVersion !== AUTH_VERSION) return;
    if(r.status===401){ setAuthenticated(false); return; }
    if(!r.ok) throw new Error(d.error||r.status);
    if(!d || typeof d!=="object" || !Array.isArray(d.sessions) || !d.library || typeof d.library!=="object") {
      throw new Error("bad_payload");
    }
  }catch(e){
    if(requestVersion !== AUTH_VERSION) return;
    if(AUTHENTICATED) document.getElementById("agg").textContent = "后台连接失败，正在重试";
    return;
  }
  if(requestVersion !== AUTH_VERSION) return;
  if(!AUTHENTICATED) setAuthenticated(true);
  const rawFocus = d.focus && typeof d.focus==="object" ? d.focus : {};
  FOCUS = {sid:typeof rawFocus.sid==="string"?rawFocus.sid:null,locked:!!rawFocus.locked,
    page:rawFocus.page==="standby"?"standby":"auto"};
  const n = value => Number.isFinite(Number(value)) ? Number(value) : 0;
  const count = value => Math.max(0,Math.round(n(value)));
  const rate = value => value == null || value === "" ? null : Math.max(0,Math.min(1,n(value)));
  const pct = value => { const v=rate(value); return v==null ? "—" : Math.round(v*100)+"%"; };
  const sessions = d.sessions.filter(s=>s&&typeof s==="object"&&typeof s.sid==="string"&&s.sid);
  document.getElementById("stats").innerHTML =
    '<div><b>'+count(d.online)+'</b><span>在场</span></div>'+
    '<div><b>'+count(d.finished)+'</b><span>已完成</span></div>'+
    '<div><b>'+(d.online_avg_clicks==null?'—':n(d.online_avg_clicks))+'</b><span>在场平均点击</span></div>'+
    '<div><b>'+pct(d.converge_rate)+'</b><span>当前收敛率</span></div>'+
    '<div><b>'+count(d.participants)+'</b><span>累计参与</span></div>'+
    '<div><b>'+pct(d.feedback_good_rate)+'</b><span>累计认为准</span></div>'+
    '<div><b>'+pct(d.verify_hit_rate)+'</b><span>画像验证命中</span></div>';
  document.getElementById("lib").textContent =
    "内容库 "+count(d.library.contents)+" 条 · 探针 "+count(d.library.probes)+" 条 · 广告 "+
    count(d.library.ads)+" 条 · 成对探针 "+count(d.library.pairs)+" 组 · κ="+n(d.kappa||2).toFixed(1);
  document.getElementById("agg").textContent =
    "累计指标：参与 "+count(d.participants)+" 人 · 反馈 "+count(d.feedback_count)+" 条"+
    (d.persistence_healthy===false ? "（保存异常）" : "");
  const kInput = document.getElementById("k");
  const serverKappa = Math.max(.5,Math.min(4,n(d.kappa||2)));
  /* 轮询期间不要覆盖管理员正在拖动的滑块；松手后下一轮再同步服务端值。 */
  if (document.activeElement !== kInput) kInput.value = serverKappa;
  document.getElementById("kv").textContent = document.activeElement === kInput ? kInput.value : serverKappa.toFixed(1);
  document.getElementById("pAuto").className = FOCUS.page==="auto" ? "on":"";
  document.getElementById("pStandby").className = FOCUS.page==="standby" ? "on":"";
  const sessionsBox = document.getElementById("sessions");
  const deleteBox = document.getElementById("deleteSessions");
  const sessionsScrollTop = sessionsBox.scrollTop;
  const focused = document.activeElement;
  const focusAction = focused && focused.dataset ? focused.dataset.action : "";
  const focusSid = focused && focused.dataset ? focused.dataset.sid : "";
  sessionsBox.innerHTML = sessions.length ?
    sessions.map(s=>'<div class="sess"><div><b>'+esc(s.codename||"未命名会话")+'</b><br>'+
      '<i>'+esc(s.persona||"尚未形成侧写")+' · '+count(s.clicks)+' 点击 · '+count(s.events)+' 行为'+(s.show_on_screen?'':' · 不上大屏')+(s.finished?' · 已完成':'')+'</i></div>'+
      '<div class="r"><button type="button" class="'+(FOCUS.sid===s.sid&&FOCUS.locked?'on':'')+
      '" data-action="lock" data-sid="'+esc(s.sid)+'" aria-label="锁定 '+esc(s.codename||"未命名会话")+'">'+(FOCUS.sid===s.sid&&FOCUS.locked?'已锁定':'锁定')+'</button>'+ 
      '</div></div>').join("")
    : '<div class="note">暂无在场观众</div>';
  deleteBox.innerHTML = sessions.length ?
    sessions.map(s=>{const deleting=pendingDeletes.has(String(s.sid));return '<div class="danger-row"><span>'+esc(s.codename||"未命名会话")+'</span><button type="button" class="danger" data-action="delete" data-sid="'+esc(s.sid)+'" aria-label="删除 '+esc(s.codename||"未命名会话")+' 会话"'+(deleting?' disabled aria-busy="true"':'')+'>'+(deleting?'删除中':'删除')+'</button></div>';}).join("") :
    '<div class="note">暂无可删除会话</div>';
  sessionsBox.scrollTop = sessionsScrollTop;
  if (focusAction && focusSid && AUTHENTICATED) {
    requestAnimationFrame(()=>{
      const next = [...document.querySelectorAll('[data-action]')]
        .find(el => el.dataset.action === focusAction && el.dataset.sid === focusSid);
      if (next && (!focused || !focused.isConnected || document.activeElement === document.body)) next.focus({preventScroll:true});
    });
  }
}
async function load(){
  if(loadPromise){ loadAgain = true; return loadPromise; }
  const cycle = async()=>{
    loadAgain = false; await loadOnce();
    if(loadAgain){ loadAgain = false; await loadOnce(); }
  };
  loadPromise = cycle();
  try { return await loadPromise; }
  finally {
    loadPromise = null;
    if(loadAgain){ loadAgain = false; load(); }
  }
}
async function post(u,b){
  /* 所有控制写操作共用一条队列，避免快速切换页面/焦点时请求顺序
     反过来，轮询只负责读取最终状态。 */
  const run = async()=>{
    let succeeded = false;
    if(!AUTHENTICATED) return;
    try{
      const r=await fetchTimed(u,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(b||{})});
      const d=await r.json().catch(()=>({}));
      if(r.status===401){ setAuthenticated(false); return; }
      if(!r.ok||d.ok===false)throw new Error(d.error||r.status);
      succeeded = true;
    }catch(e){
      if(AUTHENTICATED) document.getElementById("agg").textContent=e.code === "network" ? "后台连接超时，正在重试" : "操作失败，请检查服务端";
    }
    if(AUTHENTICATED&&succeeded) load();
  };
  controlQueue = controlQueue.then(run, run);
  return controlQueue;
}
function page(p){
  if(p!=="auto"&&p!=="standby") return;
  FOCUS.page=p;
  document.getElementById("pAuto").className=p==="auto"?"on":"";
  document.getElementById("pStandby").className=p==="standby"?"on":"";
  post("/api/admin/page",{page:p});
}
function lock(sid){
  const on = !(FOCUS.sid===sid && FOCUS.locked);
  /* 先更新本地快照，让连续点击同一行表现为“锁定 / 解锁”而不是
     因等待轮询而连续发送两次锁定。服务端失败时下一轮轮询会纠正它。 */
  FOCUS.sid=on?sid:null; FOCUS.locked=on;
  post("/api/admin/focus",{sid:on?sid:null, locked:on});
}
function setK(){
  const value=parseFloat(document.getElementById("k").value);
  if(!Number.isFinite(value)){
    document.getElementById("agg").textContent="参数无效，请重新选择 κ";
    return;
  }
  post("/api/admin/kappa",{kappa:Math.max(.5,Math.min(4,value))});
}
const pendingDeletes = new Set();
async function del(sid){
  if(!sid || pendingDeletes.has(sid)) return;
  if(!confirm("删除该会话的全部数据？")) return;
  pendingDeletes.add(sid);
  const button = [...document.querySelectorAll('[data-action="delete"]')].find(b=>b.dataset.sid===sid);
  if(button) button.disabled = true;
  let deleted = false;
  try{
    const r=await fetchTimed("/api/admin/session?sid="+encodeURIComponent(sid),{method:"DELETE",credentials:"same-origin"});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){ setAuthenticated(false); return; }
    if(!r.ok||d.deleted!==true) throw new Error(d.error||"not_deleted");
    deleted = true;
  }catch(e){
    document.getElementById("agg").textContent="删除失败，请检查服务端";
  } finally {
    pendingDeletes.delete(sid);
  }
  if(!deleted && button && AUTHENTICATED) button.disabled = false;
  if(AUTHENTICATED&&deleted) load(); }
function reset(){ if(confirm("清空当前全部会话？此操作不可恢复。")) post("/api/admin/reset"); }
document.getElementById("sessions").addEventListener("click", e=>{
  const button = e.target.closest('button[data-action="lock"]');
  if(button) lock(button.dataset.sid);
});
document.getElementById("deleteSessions").addEventListener("click", e=>{
  const button = e.target.closest('button[data-action="delete"]');
  if(button) del(button.dataset.sid);
});
document.getElementById("pAuto").addEventListener("click", ()=>page("auto"));
document.getElementById("pStandby").addEventListener("click", ()=>page("standby"));
document.getElementById("applyK").addEventListener("click", setK);
document.getElementById("resetButton").addEventListener("click", reset);
document.getElementById("k").addEventListener("input", e=>{
  document.getElementById("kv").textContent = e.target.value;
});
setAuthenticated(false);
load();
setInterval(()=>{ if(AUTHENTICATED) load(); }, 2000);
</script>
</body>
</html>
